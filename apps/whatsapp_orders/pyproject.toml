[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whatsapp_orders"
version = "0.0.1"
description = "WhatsApp Order Management System"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "frappe",
]

[project.urls]
Homepage = "https://github.com/your-username/whatsapp_orders"
Repository = "https://github.com/your-username/whatsapp_orders.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["whatsapp_orders*"]



